<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group 6 Smart Chatbot</title>

    <link rel="stylesheet" href="my_style.css">

</head>


<body>

    <div class="chat-container">

        <header class="chat-header">

            <h1>Group 6 Smart Chatbot</h1>

            <p>
                Ask questions and get simple AI-powered answers.
            </p>

        </header>


        <div id="status" class="status">
            Loading AI model...
        </div>


        <main id="chatBox" class="chat-box">

            <div class="bot-message">

                <div class="message">

                    Hello! I am your smart virtual assistant. Ask me a question !

                </div>

            </div>

        </main>


        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
            >

            <button id="sendButton">
                Send
            </button>

            <button id="clearButton">
                Clear
            </button>

        </div>

    </div>


    <script type="module" src="script.js"></script>

</body>

</html>
